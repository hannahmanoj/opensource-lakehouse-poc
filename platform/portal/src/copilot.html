<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Copilot · Madayn Data Lakehouse</title>
    <link rel="icon" type="image/png" href="madayn-logo.png" />
    <script src="theme.js?v=20260916-23"></script>
    <link rel="stylesheet" href="styles.css?v=20260916-24" />
  </head>
  <body class="canvas-app copilot-page">
    <header class="floating-header">
      <div class="header-left">
        <a class="canvas-brand" href="index.html#workflow"
          ><img src="madayn-logo.png" alt="Madayn"
        /></a>
        <nav class="workspace-nav">
          <a href="index.html#services">Services</a
          ><a href="index.html#data">Data products</a
          ><a href="index.html#pipelines">Pipelines</a
          ><a href="index.html#workflow">Workflow</a>
        </nav>
      </div>
      <div class="portal-title"><span>Madayn Data Lakehouse Portal</span></div>
      <div class="header-right">
<button
          class="header-icon"
          id="theme-toggle"
          onclick="toggleMadaynTheme()"
          aria-label="Toggle contrast"
        >
          ◐
        </button>
      </div>
    </header>
    <main class="copilot-main">
      <div class="chat-head">
        <div>
          <h1>Operations Copilot</h1>
        </div>
      </div>
      <div class="chat-scroll" id="chat-scroll">
        <section class="copilot-empty" id="copilot-empty">
          <i>✦</i>
          <h2>What would you like to tackle?</h2>
          <div class="suggested-prompts" id="suggested-prompts">
            <button data-component="spark">
              Why did the latest Spark ingestion fail?</button
            ><button>Show how data reaches the Gold layer</button
            ><button>Which services are unhealthy?</button
            ><button data-component="trino">
              Why can’t this user access the Iceberg catalog?</button
            ><button data-component="iceberg">
              Which tables may have too many small files?
            </button>
          </div>
        </section>
        <div class="conversation" id="conversation"></div>
      </div>
      <div class="chat-composer-wrap">
        <div class="context-panel" id="context-panel" hidden>
          <label
            >Component<select id="component">
              <option value="">All components</option>
              <option>airflow</option>
              <option>spark</option>
              <option>trino</option>
              <option>iceberg</option>
              <option>minio</option>
              <option>nifi</option>
            </select></label
          ><label
            >Severity<select id="severity">
              <option value="">All severities</option>
              <option>info</option>
              <option>warning</option>
              <option>error</option>
              <option>critical</option>
            </select></label
          ><label>From<input id="from-time" type="datetime-local" /></label
          ><label>To<input id="to-time" type="datetime-local" /></label>
        </div>
        <form class="chat-composer" id="copilot-form">
          <span>✦</span
          ><textarea
            id="question"
            maxlength="1000"
            required
            rows="2"
            placeholder="Ask Copilot about your lakehouse…"
          ></textarea
          ><button id="submit-button" type="submit">↑</button>
        </form>
        <div class="composer-footer">
          <button class="context-button" id="context-button" type="button">
            ＋ Add context or filters</button
          ><span>copilot can make mistakes, verify important details</span>
        </div>
      </div>
    </main>
    <script src="copilot.js?v=20260916-22"></script>
  </body>
</html>
