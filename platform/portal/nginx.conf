server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /portal-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /health/trino {
        proxy_pass http://trino:8080/v1/info;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /health/airflow {
        proxy_pass http://airflow:8080/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /health/minio {
        proxy_pass http://minio:9000/minio/health/live;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
