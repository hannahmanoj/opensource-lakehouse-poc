server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /portal-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/copilot/ {
        proxy_pass http://copilot-api:8100/api/copilot/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location /health/trino {
        proxy_pass http://trino:8080/v1/info;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /health/airflow {
        proxy_pass http://airflow:8080/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /health/minio {
        proxy_pass http://minio:9000/minio/health/live;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /health/openmetadata {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $openmetadata http://openmetadata-server:8585;
        proxy_pass $openmetadata/api/v1/system/version;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
