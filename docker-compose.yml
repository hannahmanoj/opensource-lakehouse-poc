services:
  copilot-db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: copilot-db
    environment:
      POSTGRES_DB: ${COPILOT_DB_NAME}
      POSTGRES_USER: ${COPILOT_DB_USER}
      POSTGRES_PASSWORD: ${COPILOT_DB_PASSWORD}
    volumes:
      - copilot-db-data:/var/lib/postgresql/data
      - ./platform/copilot/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  copilot-api:
    build:
      context: platform/copilot/api
    image: poc-lakehouse-copilot-api:0.1.0
    container_name: copilot-api
    environment:
      COPILOT_DATABASE_URL: ${COPILOT_DATABASE_URL}
      COPILOT_KNOWLEDGE_PATH: /knowledge
      COPILOT_EMBEDDING_MODEL: BAAI/bge-m3
      HF_HOME: /home/copilot/.cache/huggingface
      COPILOT_AIRFLOW_URL: http://airflow:8080
      COPILOT_AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      COPILOT_AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      COPILOT_TRINO_URL: http://trino:8080
      COPILOT_TRINO_USER: copilot
      COPILOT_MAX_LOG_BYTES: ${COPILOT_MAX_LOG_BYTES:-32768}
      COPILOT_SMALL_FILE_THRESHOLD_BYTES: ${COPILOT_SMALL_FILE_THRESHOLD_BYTES:-134217728}
      COPILOT_LLM_PROVIDER: ${COPILOT_LLM_PROVIDER:-ollama}
      COPILOT_LLM_BASE_URL: ${COPILOT_LLM_BASE_URL:-http://host.docker.internal:11434}
      COPILOT_LLM_MODEL: ${COPILOT_LLM_MODEL:-qwen3:8b}
      COPILOT_LLM_TEMPERATURE: ${COPILOT_LLM_TEMPERATURE:-0.1}
      COPILOT_LLM_TIMEOUT_SECONDS: ${COPILOT_LLM_TIMEOUT_SECONDS:-120}
    volumes:
      - ./platform/copilot/api/app:/app/app:ro
      - ./platform/copilot/knowledge:/knowledge:ro
      - copilot-model-cache:/home/copilot/.cache/huggingface
    ports:
      - "8100:8100"
    depends_on:
      copilot-db:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: platform/portal
    image: poc-lakehouse-portal:1.0
    container_name: lakehouse-portal
    ports:
      - "3000:80"
    depends_on:
      - minio
      - trino
      - airflow
      - nifi
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  iceberg-rest:
    image: tabulario/iceberg-rest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
    depends_on:
      - minio

  trino:
    image: trinodb/trino
    container_name: trino
    environment:
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_AWS_SECRET_ACCESS_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./platform/trino/catalog:/etc/trino/catalog:ro
      - ./platform/trino/access-control/access-control.properties:/etc/trino/access-control.properties:ro
      - ./platform/trino/access-control/group-provider.properties:/etc/trino/group-provider.properties:ro
      - ./platform/trino/access-control/groups.txt:/etc/trino/security/groups.txt:ro
      - ./platform/trino/access-control/rules.json:/etc/trino/security/rules.json:ro
    depends_on:
      - iceberg-rest

  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    environment:
      - AWS_ACCESS_KEY_ID=${LAKEHOUSE_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${LAKEHOUSE_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - SPARK_HOME=/opt/spark
    volumes:
      - ./domains:/opt/project/domains:ro
      - ./data:/opt/data
    ports:
      - "8888:8888"
    depends_on:
      - iceberg-rest
      - minio

  airflow:
    build:
      context: platform/docker/airflow
    image: poc-lakehouse-airflow:2.9.3
    container_name: airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      NIFI_API_URL: ${NIFI_API_URL}
      NIFI_SINGLE_USER_USERNAME: ${NIFI_SINGLE_USER_USERNAME}
      NIFI_SINGLE_USER_PASSWORD: ${NIFI_SINGLE_USER_PASSWORD}
      NIFI_TAXI_PROCESS_GROUP_ID: ${NIFI_TAXI_PROCESS_GROUP_ID}
      NIFI_TAXI_QUERY_PROCESSOR_ID: ${NIFI_TAXI_QUERY_PROCESSOR_ID}
      NIFI_TAXI_S3_PROCESSOR_ID: ${NIFI_TAXI_S3_PROCESSOR_ID}
      LAKEHOUSE_AWS_ACCESS_KEY_ID: ${LAKEHOUSE_AWS_ACCESS_KEY_ID}
      LAKEHOUSE_AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./domains/demo-artists/dags:/opt/airflow/dags/demo-artists:ro
      - ./domains/industrial-energy/dags:/opt/airflow/dags/industrial-energy:ro
      - ./domains/transport/taxi/dags:/opt/airflow/dags/transport-taxi:ro
      - ./data:/opt/airflow/project/data
      - airflow-data:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8080"
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username "$${AIRFLOW_ADMIN_USERNAME}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname A --lastname B --role Admin --email "$${AIRFLOW_ADMIN_EMAIL}" || true) &&
      (airflow webserver --pid /tmp/airflow-webserver.pid & exec airflow scheduler)"
    depends_on:
      - trino
      - spark-iceberg
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - ./:/data

  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_SINGLE_USER_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_SINGLE_USER_PASSWORD}
      NIFI_WEB_PROXY_HOST: "localhost:8443,nifi:8443"
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    volumes:
      - ./platform/nifi/drivers:/opt/nifi/nifi-current/drivers:ro
    depends_on:
      - sqlserver
      - minio

  nifi-registry:
    image: apache/nifi-registry:1.28.1
    container_name: nifi-registry
    ports:
      - "18080:18080"
    environment:
      NIFI_REGISTRY_WEB_HTTP_PORT: "18080"
    volumes:
      - nifi-registry-database:/opt/nifi-registry/nifi-registry-current/database
      - nifi-registry-flow-storage:/opt/nifi-registry/nifi-registry-current/flow_storage
    restart: unless-stopped

  openmetadata-db:
    profiles: ["governance"]
    image: docker.getcollate.io/openmetadata/db:1.12.6
    container_name: openmetadata-db
    command: "--sort_buffer_size=10M"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_USER: ${OPENMETADATA_MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD: ${OPENMETADATA_MYSQL_ROOT_PASSWORD}
    volumes:
      - openmetadata-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=$$MYSQL_ROOT_USER --password=$$MYSQL_ROOT_PASSWORD --silent --execute 'use openmetadata_db'"]
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata-search:
    profiles: ["governance"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: openmetadata-search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "false"
    volumes:
      - openmetadata-search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata-migrate:
    profiles: ["governance"]
    image: docker.getcollate.io/openmetadata/server:1.12.6
    container_name: openmetadata-migrate
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment: &openmetadata-environment
      OPENMETADATA_CLUSTER_NAME: madayn-lakehouse
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHORIZER_ADMIN_PRINCIPALS: "[${OPENMETADATA_ADMIN_PRINCIPAL}]"
      AUTHORIZER_INGESTION_PRINCIPALS: "[${OPENMETADATA_INGESTION_PRINCIPAL}]"
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: ${OPENMETADATA_DB_USER}
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
      DB_HOST: openmetadata-db
      DB_PORT: "3306"
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      OPENMETADATA_HEAP_OPTS: -Xms1g -Xmx1g
    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata-search:
        condition: service_healthy
    restart: "no"

  openmetadata-server:
    profiles: ["governance"]
    image: docker.getcollate.io/openmetadata/server:1.12.6
    container_name: openmetadata-server
    restart: unless-stopped
    environment:
      <<: *openmetadata-environment
      PIPELINE_SERVICE_CLIENT_ENABLED: "true"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
    ports:
      - "8585:8585"
    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata-search:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20

  openmetadata-ingestion:
    profiles: ["governance"]
    image: docker.getcollate.io/openmetadata/ingestion:1.12.6
    container_name: openmetadata-ingestion
    restart: unless-stopped
    entrypoint: /bin/bash
    command: ["/opt/airflow/ingestion_dependency.sh"]
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: /opt/airflow/dag_generated_configs
      DB_HOST: openmetadata-db
      DB_PORT: "3306"
      AIRFLOW_DB: airflow_db
      DB_SCHEME: mysql+mysqldb
      DB_USER: ${OPENMETADATA_INGESTION_DB_USER}
      DB_PASSWORD: ${OPENMETADATA_INGESTION_DB_PASSWORD}
    volumes:
      - openmetadata-ingestion-configs:/opt/airflow/dag_generated_configs
      - openmetadata-ingestion-dags:/opt/airflow/dags
      - openmetadata-ingestion-tmp:/tmp
    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
volumes:
  minio-data:
  airflow-data:
  openmetadata-db-data:
  openmetadata-search-data:
  openmetadata-ingestion-configs:
  openmetadata-ingestion-dags:
  openmetadata-ingestion-tmp:
  nifi-registry-database:
  nifi-registry-flow-storage:
  copilot-db-data:
  copilot-model-cache:
